<svg xmlns="http://www.w3.org/2000/svg" width="440" height="335" viewBox="0 0 440 335" role="img" aria-labelledby="title desc">
<title id="title">动态栈满时扩容后再写入</title>
<desc id="desc">A、B、C 已满。保留长度 3，更换缓冲区并把 top 指向下标 3。写入 D 后 top 指向下标 4。后两行仅画出前五格。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#625b54" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="438" height="333" rx="9" fill="#fbf8f1" stroke="#c6b9a7"/>
<text x="21" y="32" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" fill="#302b27" text-anchor="start" font-weight="600">top 总在已用区间的右边</text>
<text x="24" y="69" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" fill="#302b27" text-anchor="start" font-weight="600">① 原缓冲已满</text>
<rect x="30" y="83" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="54.5" y="106.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">A</text>
<rect x="88" y="83" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="112.5" y="106.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">B</text>
<rect x="146" y="83" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="170.5" y="106.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">C</text>
<path d="M200 134 V118" fill="none" stroke="#625b54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="207" y="138" font-family="Cascadia Code,Consolas,monospace" font-size="15" fill="#625b54" text-anchor="start">top</text>
<text x="24" y="162" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" fill="#302b27" text-anchor="start" font-weight="600">② 扩容成功，恢复 top</text>
<rect x="30" y="176" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="54.5" y="199.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">A</text>
<rect x="88" y="176" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="112.5" y="199.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">B</text>
<rect x="146" y="176" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="170.5" y="199.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">C</text>
<rect x="204" y="176" width="49" height="35" rx="4" fill="none" stroke="#c6b9a7" stroke-dasharray="4 3"/>
<rect x="262" y="176" width="49" height="35" rx="4" fill="none" stroke="#c6b9a7" stroke-dasharray="4 3"/>
<text x="322" y="200" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="19" fill="#625b54" text-anchor="start">…</text>
<path d="M200 227 V211" fill="none" stroke="#625b54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="207" y="231" font-family="Cascadia Code,Consolas,monospace" font-size="15" fill="#625b54" text-anchor="start">top</text>
<text x="24" y="255" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" fill="#302b27" text-anchor="start" font-weight="600">③ 写入 D，再移 top</text>
<rect x="30" y="269" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="54.5" y="292.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">A</text>
<rect x="88" y="269" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="112.5" y="292.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">B</text>
<rect x="146" y="269" width="49" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="170.5" y="292.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">C</text>
<rect x="204" y="269" width="49" height="35" rx="4" fill="#f4e3d2" stroke="#934728"/>
<text x="228.5" y="292.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#934728" text-anchor="middle" font-weight="600">D</text>
<rect x="262" y="269" width="49" height="35" rx="4" fill="none" stroke="#c6b9a7" stroke-dasharray="4 3"/>
<text x="322" y="293" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="19" fill="#625b54" text-anchor="start">…</text>
<path d="M258 320 V304" fill="none" stroke="#625b54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="265" y="324" font-family="Cascadia Code,Consolas,monospace" font-size="15" fill="#625b54" text-anchor="start">top</text>
</svg>
