<rect x="236" y="165" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="262.0" y="188.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">10</text>
<rect x="300" y="165" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="326.0" y="188.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">11</text>
<text x="30" y="232" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="16" fill="#625b54" text-anchor="start">格内是顺序编号，从 0 开始。</text>
<text x="30" y="259" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" fill="#934728" text-anchor="start" font-weight="600">先跨一行，再向右两格：4 + 2 = 6。</text>
