<svg xmlns="http://www.w3.org/2000/svg" width="440" height="282" viewBox="0 0 440 282" role="img" aria-labelledby="title desc">
<title id="title">三行四列数组的顺序编号</title>
<desc id="desc">三行编号为 0 至 3、4 至 7、8 至 11。第二行第三列是编号 6。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#625b54" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="438" height="280" rx="9" fill="#fbf8f1" stroke="#c6b9a7"/>
<text x="21" y="32" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" fill="#302b27" text-anchor="start" font-weight="600">grid[1][2] 在哪里？</text>
<text x="134" y="65" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="16" fill="#625b54" text-anchor="middle">列 0</text>
<text x="198" y="65" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="16" fill="#625b54" text-anchor="middle">列 1</text>
<text x="262" y="65" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="16" fill="#625b54" text-anchor="middle">列 2</text>
<text x="326" y="65" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="16" fill="#625b54" text-anchor="middle">列 3</text>
<text x="31" y="102" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" fill="#625b54" text-anchor="start">行 0</text>
<rect x="108" y="77" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="134.0" y="100.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">0</text>
<rect x="172" y="77" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="198.0" y="100.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">1</text>
<rect x="236" y="77" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="262.0" y="100.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">2</text>
<rect x="300" y="77" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="326.0" y="100.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">3</text>
<text x="31" y="146" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" fill="#625b54" text-anchor="start">行 1</text>
<rect x="108" y="121" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="134.0" y="144.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">4</text>
<rect x="172" y="121" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="198.0" y="144.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">5</text>
<rect x="236" y="121" width="52" height="35" rx="4" fill="#f4e3d2" stroke="#934728"/>
<text x="262.0" y="144.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#934728" text-anchor="middle" font-weight="600">6</text>
<rect x="300" y="121" width="52" height="35" rx="4" fill="#fffdf8" stroke="#c6b9a7"/>
<text x="326.0" y="144.5" font-family="Cascadia Code,Consolas,monospace" font-size="19" fill="#302b27" text-anchor="middle" font-weight="600">7</text>
<text x="31" y="190" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" fill="#625b54" text-anchor="start">行 2</text>
