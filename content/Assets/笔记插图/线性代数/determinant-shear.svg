<svg xmlns="http://www.w3.org/2000/svg" width="480" height="308" viewBox="0 0 480 308" role="img" aria-labelledby="title desc">
<title id="title">列倍加后，平行四边形的底和高不变</title>
<desc id="desc">实线形状的边为 u=(2,0)、v=(1,1)。虚线形状把 v 换成 v+u=(3,1)。两张图形底长为 2，高均为 1。</desc>
<defs><marker id="at" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#32626a"/></marker><marker id="ar" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#a1462e"/></marker><marker id="ak" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#302b25"/></marker><marker id="ag" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#82796e"/></marker></defs>
<rect width="480" height="308" rx="12" fill="#faf6eb"/>
<g font-family="system-ui, Microsoft YaHei, PingFang SC, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<line x1="43" y1="211" x2="435" y2="211" stroke="#82796e" stroke-width="1.3"/>
<line x1="59" y1="142" x2="435" y2="142" stroke="#c7bfae" stroke-width="1.4" stroke-dasharray="5 5"/>
<polygon points="59,211 197,211 266,142 128,142" fill="#e4ece7" stroke="#32626a" stroke-width="2.3"/>
<polygon points="59,211 197,211 404,142 266,142" fill="none" stroke="#a1462e" stroke-width="2.6" stroke-dasharray="7 5"/>
<line x1="59" y1="211" x2="197" y2="211" stroke="#302b25" stroke-width="3" marker-end="url(#ak)"/>
<circle cx="59" cy="211" r="4" fill="#302b25"/>
<text x="43" y="237" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">O</text>
<text x="101" y="238" text-anchor="start" font-size="17" font-weight="450" fill="#302b25">u = (2, 0)</text>
<text x="82" y="126" text-anchor="start" font-size="17" font-weight="450" fill="#32626a">v = (1, 1)</text>
<text x="233" y="126" text-anchor="start" font-size="17" font-weight="450" fill="#a1462e">v + u = (3, 1)</text>
<line x1="128" y1="90" x2="266" y2="90" stroke="#302b25" stroke-width="1.8" marker-end="url(#ak)"/>
<text x="196" y="76" text-anchor="middle" font-size="17" font-weight="450" fill="#302b25">平移一个 u</text>
<line x1="422" y1="142" x2="422" y2="211" stroke="#82796e" stroke-width="1.4"/>
<line x1="418" y1="142" x2="426" y2="142" stroke="#82796e" stroke-width="1.4"/>
<line x1="418" y1="211" x2="426" y2="211" stroke="#82796e" stroke-width="1.4"/>
<text x="433" y="184" text-anchor="start" font-size="17" font-weight="450" fill="#302b25">1</text>
<text x="43" y="284" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">两种形状的底都长 2，高都是 1。</text>
</g>
</svg>
