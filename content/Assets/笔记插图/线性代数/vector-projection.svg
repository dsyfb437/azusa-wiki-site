<svg xmlns="http://www.w3.org/2000/svg" width="480" height="338" viewBox="0 0 480 338" role="img" aria-labelledby="title desc">
<title id="title">向量投影与垂直分量</title>
<desc id="desc">原点 O 到 V(1,3) 的向量投影到方向 (1,1)，垂足 H 为 (2,2)。图上残差 HV 垂直于 OH。</desc>
<defs><marker id="at" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#32626a"/></marker><marker id="ar" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#a1462e"/></marker><marker id="ak" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#302b25"/></marker><marker id="ag" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#82796e"/></marker></defs>
<rect width="480" height="338" rx="12" fill="#faf6eb"/>
<g font-family="system-ui, Microsoft YaHei, PingFang SC, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<line x1="50" y1="270" x2="411" y2="270" stroke="#82796e" stroke-width="1.6" marker-end="url(#ag)"/>
<line x1="83" y1="286" x2="83" y2="35" stroke="#82796e" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="420" y="276" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">x</text>
<text x="76" y="26" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">y</text>
<text x="59" y="290" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">O</text>
<line x1="83" y1="270" x2="314" y2="39" stroke="#c7bfae" stroke-width="2" stroke-dasharray="5 6"/>
<text x="325" y="51" text-anchor="start" font-size="18" font-weight="450" fill="#32626a">u 的方向</text>
<line x1="83" y1="270" x2="217" y2="136" stroke="#32626a" stroke-width="4" marker-end="url(#at)"/>
<line x1="83" y1="270" x2="150" y2="69" stroke="#302b25" stroke-width="3.2" marker-end="url(#ak)"/>
<line x1="217" y1="136" x2="150" y2="69" stroke="#a1462e" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<path d="M207.8 145.2 l-9.2 -9.2 9.2 -9.2" fill="none" stroke="#a1462e" stroke-width="1.8"/>
<circle cx="217" cy="136" r="3.4" fill="#32626a"/>
<text x="231" y="148" text-anchor="start" font-size="19" font-weight="450" fill="#32626a">H (2, 2)</text>
<text x="165" y="68" text-anchor="start" font-size="19" font-weight="450" fill="#302b25">V (1, 3)</text>
<text x="242" y="105" text-anchor="start" font-size="16" font-weight="450" fill="#a1462e">垂直分量</text>
<line x1="235" y1="100" x2="200" y2="119" stroke="#a1462e" stroke-width="1.2"/>
<text x="158" y="235" text-anchor="start" font-size="17" font-weight="450" fill="#32626a">投影</text>
<text x="84" y="316" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">OH 沿 u，HV 与 u 垂直。</text>
</g>
</svg>
