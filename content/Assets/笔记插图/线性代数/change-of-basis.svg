<svg xmlns="http://www.w3.org/2000/svg" width="480" height="335" viewBox="0 0 480 335" role="img" aria-labelledby="title desc">
<title id="title">同一向量的两组坐标</title>
<desc id="desc">标准基路径先走一份 e₂，再走三份 e₁；斜基路径先走两份 β₁=(1,0)，再走一份 β₂=(1,1)。两条路的终点都是 (3,1)。</desc>
<defs><marker id="at" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#32626a"/></marker><marker id="ar" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#a1462e"/></marker><marker id="ak" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#302b25"/></marker><marker id="ag" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 z" fill="#82796e"/></marker></defs>
<rect width="480" height="335" rx="12" fill="#faf6eb"/>
<g font-family="system-ui, Microsoft YaHei, PingFang SC, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<line x1="48" y1="219" x2="424" y2="219" stroke="#82796e" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="62" y1="235" x2="62" y2="43" stroke="#82796e" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="432" y="225" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">x</text>
<text x="55" y="35" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">y</text>
<text x="43" y="242" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">O</text>
<line x1="62" y1="219" x2="62" y2="125" stroke="#32626a" stroke-width="3.8" marker-end="url(#at)"/>
<line x1="62" y1="125" x2="344" y2="125" stroke="#32626a" stroke-width="3.8" marker-end="url(#at)"/>
<line x1="62" y1="219" x2="250" y2="219" stroke="#a1462e" stroke-width="3.8" marker-end="url(#ar)"/>
<line x1="250" y1="219" x2="344" y2="125" stroke="#a1462e" stroke-width="3.8" marker-end="url(#ar)"/>
<line x1="62" y1="219" x2="344" y2="125" stroke="#302b25" stroke-width="2.2" stroke-dasharray="5 6" marker-end="url(#ak)"/>
<circle cx="344" cy="125" r="3.8" fill="#302b25"/>
<text x="352" y="115" text-anchor="start" font-size="19" font-weight="450" fill="#302b25">v (3, 1)</text>
<text x="177" y="113" text-anchor="start" font-size="18" font-weight="450" fill="#32626a">3e₁</text>
<text x="49" y="172" text-anchor="end" font-size="17" font-weight="450" fill="#32626a">e₂</text>
<text x="157" y="245" text-anchor="start" font-size="18" font-weight="450" fill="#a1462e">2β₁</text>
<text x="307" y="188" text-anchor="start" font-size="18" font-weight="450" fill="#a1462e">β₂</text>
<line x1="54" y1="277" x2="78" y2="277" stroke="#32626a" stroke-width="3"/>
<text x="90" y="283" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">标准基：3e₁ + e₂</text>
<line x1="54" y1="308" x2="78" y2="308" stroke="#a1462e" stroke-width="3"/>
<text x="90" y="314" text-anchor="start" font-size="18" font-weight="450" fill="#302b25">斜基：2β₁ + β₂</text>
</g>
</svg>
