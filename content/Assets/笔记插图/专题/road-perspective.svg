<svg xmlns="http://www.w3.org/2000/svg" width="480" height="245" viewBox="0 0 480 245" role="img" aria-labelledby="title desc">
  <title id="title">同一条等宽的路在不同深度处的投影</title>
  <desc id="desc">路的投影边界向视平线上同一点汇聚。在深度为四的位置，两边标记之间的距离是深度为八处的两倍。两对标记分别用方块和圆点表示。</desc>
  <rect width="480" height="245" rx="8" fill="#faf7ef"/>
  <path d="M26 193 240 86 454 193Z" fill="#e4eeeb"/>
  <path d="M22 86H458" stroke="#817b70" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M26 193 240 86 454 193" fill="none" stroke="#396971" stroke-width="3"/>
  <path d="M165 123.5h150M90 161h300" fill="none" stroke="#ad4d32" stroke-width="2"/>
  <g fill="#ad4d32"><circle cx="165" cy="123.5" r="4.8"/><circle cx="315" cy="123.5" r="4.8"/>
    <rect x="85" y="156" width="10" height="10"/><rect x="385" y="156" width="10" height="10"/></g>
  <circle cx="240" cy="86" r="5" fill="#342f29"/>
  <g font-family="'Microsoft YaHei', sans-serif" font-size="17" fill="#39332e">
    <text x="28" y="70">视平线</text><text x="211" y="63">消失点</text>
  </g>
  <g font-family="Georgia, serif" font-size="20" fill="#7e3d2b">
    <text x="327" y="120">Z = 8</text><text x="394" y="154">Z = 4</text>
  </g>
</svg>
